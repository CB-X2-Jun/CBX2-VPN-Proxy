name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v0.1.0，仅手动触发时使用）'
        required: false
        default: 'v0.0.0-dev'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package release folder
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            Write-Error "Release 目录不存在: $releaseDir"
            exit 1
          }
          $version = "${{ steps.version.outputs.version }}"
          $zipName = "cbx2-vpn-windows-x64-$version.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipName -Force
          Write-Host "已打包: $zipName"
          Get-ChildItem $releaseDir | Format-Table Name, Length

      - name: Upload artifact (构建产物留存)
        uses: actions/upload-artifact@v4
        with:
          name: cbx2-vpn-windows
          path: cbx2-vpn-windows-x64-*.zip
          retention-days: 30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: CBX2 VPN & Proxy ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: cbx2-vpn-windows-x64-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.CCCCCTOKEN }}
